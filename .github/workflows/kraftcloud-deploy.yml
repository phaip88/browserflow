name: Deploy to Unikraft Cloud (sin)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Unikraft CLI
        uses: unikraft/setup-action@v1
        with:
          token: ${{ secrets.UKC_TOKEN || 'cm9ib3QkYmlnYm9zcy51c2Vycy5rcmFmdGNsb3VkOnBpYk5rVGRhS1dwaTNDNzlUN0xFZ1RGMVpyV1BzdmhS' }}

      - name: Migrate Database Schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://neondb_owner:npg_Y5MmzoWV6Pqk@ep-soft-field-b24t46yc.c-6.eu-central-1.aws.neon.tech/browserflow?sslmode=require' }}
        run: |
          npm install --ignore-scripts
          npx drizzle-kit push --force

      - name: Build and Deploy to Unikraft Cloud (sin)
        env:
          UKC_METRO: sin
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://neondb_owner:npg_Y5MmzoWV6Pqk@ep-soft-field-b24t46yc.c-6.eu-central-1.aws.neon.tech/browserflow?sslmode=require' }}
        run: |
          cp Dockerfile.unikraft Dockerfile
          UKC_AUTH="${{ secrets.UKC_TOKEN || 'cm9ib3QkYmlnYm9zcy51c2Vycy5rcmFmdGNsb3VkOnBpYk5rVGRhS1dwaTNDNzlUN0xFZ1RGMVpyV1BzdmhS' }}"
          DIGEST=$(curl -s -I -H "Authorization: Basic $UKC_AUTH" -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json" https://unikraft.io/v2/bigboss/browserflow/manifests/latest | grep -i 'Docker-Content-Digest' | tr -d '\r' | awk '{print $2}')
          if [ -n "$DIGEST" ]; then
            echo "Pruning existing registry manifest: $DIGEST"
            curl -s -X DELETE -H "Authorization: Basic $UKC_AUTH" "https://unikraft.io/v2/bigboss/browserflow/manifests/$DIGEST" || true
          fi
          unikraft build . --output bigboss/browserflow:latest
          curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.UKC_TOKEN || 'cm9ib3QkYmlnYm9zcy51c2Vycy5rcmFmdGNsb3VkOnBpYk5rVGRhS1dwaTNDNzlUN0xFZ1RGMVpyV1BzdmhS' }}" -H "Content-Type: application/json" -d '[{"name":"browserflow"}]' https://api.sin.unikraft.cloud/v1/instances || true
          sleep 2
          unikraft run \
            --metro sin \
            --publish 443:3000/http+tls \
            --memory 3072M \
            --vcpus 1 \
            --name browserflow \
            --env NODE_ENV=production \
            --env PORT=3000 \
            --env HOSTNAME=0.0.0.0 \
            --env SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            --env BROWSERFLOW_EMBEDDED_SUPERVISOR=false \
            --env BROWSERFLOW_DATA_DIR=/app/data \
            --env BROWSERFLOW_RUNTIME_DIR=/app/data/runtime \
            --env BROWSERFLOW_MASTER_KEY_FILE=/app/data/master.key \
            --env BROWSERFLOW_AUTH_MODE=authenticated \
            --env BROWSERFLOW_SECURE_COOKIES=false \
            --env DATABASE_URL="$DATABASE_URL" \
            --volume browserflow-data:/app/data \
            --image bigboss/browserflow:latest
