<!doctype html><html><head><meta charset="utf-8"><title>Form</title></head>
<body><h1>Form</h1><form id="f" onsubmit="event.preventDefault();document.getElementById('result').textContent='Submitted: '+document.getElementById('name').value+' / '+document.getElementById('email').value+' / '+document.getElementById('plan').value+' / '+document.getElementById('agree').checked;document.getElementById('result').style.display='block';">
<input id="name" name="name"><input id="email" name="email"><select id="plan"><option value="free">Free</option><option value="pro">Pro</option></select>
<input type="checkbox" id="agree"><button id="submit" type="submit">Submit</button></form><div id="result" style="display:none"></div></body></html>
