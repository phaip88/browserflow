[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "browserflow"
version = "1.0.0"
description = "Single-user, self-hosted, production-grade visual browser automation platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "BrowserFlow" }]
keywords = ["browser", "automation", "playwright", "workflow"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "fastapi==0.115.8",
  "uvicorn[standard]==0.34.0",
  "starlette==0.45.3",
  "sqlalchemy[asyncio]==2.0.38",
  "alembic==1.14.1",
  "asyncpg==0.30.0",
  "psycopg2-binary==2.9.10",
  "pydantic==2.10.6",
  "pydantic-settings==2.7.1",
  "email-validator==2.2.0",
  "argon2-cffi==23.1.0",
  "cryptography==44.0.1",
  "redis==5.2.1",
  "playwright==1.50.0",
  "prometheus-client==0.21.1",
  "opentelemetry-api==1.30.0",
  "opentelemetry-sdk==1.30.0",
  "opentelemetry-exporter-otlp==1.30.0",
  "opentelemetry-instrumentation-fastapi==0.51b0",
  "opentelemetry-instrumentation-sqlalchemy==0.51b0",
  "opentelemetry-instrumentation-logging==0.51b0",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
  "orjson==3.10.15",
  "structlog==25.1.0",
  "typer==0.15.1",
  "croniter==6.0.0",
  "python-dateutil==2.9.0.post0",
  "tzdata==2025.1",
  "tenacity==9.0.0",
  "websockets==14.2",
  "filelock==3.17.0",
  "jsonschema==4.23.0",
  "PyYAML==6.0.2",
  "greenlet==3.1.1",
  "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.3",
  "pytest-cov==6.0.0",
  "pytest-timeout==2.3.1",
  "ruff==0.9.6",
  "mypy==1.14.1",
  "types-python-dateutil==2.9.0.20241206",
  "types-redis==4.6.0.20241004",
  "types-jsonschema==4.23.0.20241208",
  "types-PyYAML==6.0.12.20241230",
  "pre-commit==4.1.0",
  "httpx==0.28.1",
  "respx==0.22.0",
  "time-machine==2.16.0",
  "coverage==7.6.10",
]

[project.scripts]
browserflow = "browserflow.cli.main:app"

[tool.setuptools]
zip-safe = false
include-package-data = true
packages = [
  "browserflow.api",
  "browserflow.api.middleware",
  "browserflow.api.routes",
  "browserflow.scheduler",
  "browserflow.browser_worker",
  "browserflow.cli",
  "browserflow.domain",
  "browserflow.application",
  "browserflow.infrastructure",
  "browserflow.infrastructure.db",
  "browserflow.flow_schema",
  "browserflow.flow_compiler",
  "browserflow.execution_contracts",
  "browserflow.node_sdk",
  "browserflow.node_pack_browser",
  "browserflow.node_pack_control",
  "browserflow.node_pack_data",
  "browserflow.node_pack_integration",
]

[tool.setuptools.package-dir]
"browserflow.api" = "apps/api/browserflow/api"
"browserflow.api.middleware" = "apps/api/browserflow/api/middleware"
"browserflow.api.routes" = "apps/api/browserflow/api/routes"
"browserflow.scheduler" = "apps/scheduler/browserflow/scheduler"
"browserflow.browser_worker" = "apps/browser_worker/browserflow/browser_worker"
"browserflow.cli" = "packages/cli/browserflow/cli"
"browserflow.domain" = "packages/domain/browserflow/domain"
"browserflow.application" = "packages/application/browserflow/application"
"browserflow.infrastructure" = "packages/infrastructure/browserflow/infrastructure"
"browserflow.infrastructure.db" = "packages/infrastructure/browserflow/infrastructure/db"
"browserflow.flow_schema" = "packages/flow_schema/browserflow/flow_schema"
"browserflow.flow_compiler" = "packages/flow_compiler/browserflow/flow_compiler"
"browserflow.execution_contracts" = "packages/execution_contracts/browserflow/execution_contracts"
"browserflow.node_sdk" = "packages/node_sdk/browserflow/node_sdk"
"browserflow.node_pack_browser" = "packages/node_pack_browser/browserflow/node_pack_browser"
"browserflow.node_pack_control" = "packages/node_pack_control/browserflow/node_pack_control"
"browserflow.node_pack_data" = "packages/node_pack_data/browserflow/node_pack_data"
"browserflow.node_pack_integration" = "packages/node_pack_integration/browserflow/node_pack_integration"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "packages", "tests", "scripts"]
exclude = ["migrations/versions", ".venv", "node_modules", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = [
  "S101",  # asserts are fine in tests and invariants
  "S104",  # binding 0.0.0.0 is required for containers
  "S105",  # flagged strings that are not production secrets
  "S106",
  "B008",  # FastAPI Depends in defaults
  "RUF012",
  "UP017",  # project standard is datetime.now(timezone.utc)
  "ASYNC110",  # poll loops in worker/scheduler
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106", "S105", "S311", "S324", "E501"]
"scripts/**" = ["S603", "S607"]
"packages/node_pack_*/**" = ["S311"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = [
  "packages/domain",
  "packages/application",
  "packages/infrastructure",
  "packages/flow_schema",
  "packages/flow_compiler",
  "packages/execution_contracts",
  "packages/node_sdk",
  "packages/node_pack_browser",
  "packages/node_pack_control",
  "packages/node_pack_data",
  "packages/node_pack_integration",
  "apps/api",
  "apps/scheduler",
  "apps/browser_worker",
  "packages/cli",
]
exclude = ["migrations/versions", ".venv", "apps/web", "node_modules"]

[[tool.mypy.overrides]]
module = ["croniter", "filelock", "playwright", "playwright.*", "asyncpg"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 120
pythonpath = [
  "packages/domain",
  "packages/application",
  "packages/infrastructure",
  "packages/flow_schema",
  "packages/flow_compiler",
  "packages/execution_contracts",
  "packages/node_sdk",
  "packages/node_pack_browser",
  "packages/node_pack_control",
  "packages/node_pack_data",
  "packages/node_pack_integration",
  "packages/cli",
  "apps/api",
  "apps/scheduler",
  "apps/browser_worker",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
markers = [
  "unit: fast isolated tests",
  "contract: node and API contract tests",
  "integration: tests that require PostgreSQL",
  "e2e: end-to-end tests with Chromium",
  "security: security and policy tests",
  "stability: longer-running reliability tests",
]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = [
  "packages",
  "apps/api",
  "apps/scheduler",
  "apps/browser_worker",
]
omit = ["*/tests/*", "migrations/*"]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_empty = true
